# GitHub #62, #63 and #64: three issues in the IDL-to-Rust route, each as
# reported, generated by `build.rs` and checked by `cargo run`.
# Own `[workspace]` table, so it is built where it stands and not through
# the repository's workspace.
[package]
name = "zerodds-example-zerodds-build-issues"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
zerodds-dcps = { path = "../../crates/dcps" }
zerodds-types = { path = "../../crates/types" }
zerodds-wire = { path = "../../crates/wire" }

[build-dependencies]
zerodds-build = { path = "../../crates/zerodds-build" }

[workspace]
