[package]
name = "zerodds-build-sample"
version = "0.1.0"
edition = "2024"
build = "build.rs"

# Empty [workspace] isolates this from the parent zerodds workspace, same
# as the sibling idlc-buildrs example.
[workspace]

[lib]
name = "zerodds_build_sample"
path = "src/lib.rs"

[[bin]]
name = "zerodds-build-sample-demo"
path = "src/main.rs"

[build-dependencies]
zerodds-build = { path = "../../crates/zerodds-build" }

[dependencies]
# Runtime deps the generated code names: the `DdsType` trait, the
# TypeIdentifier/TypeObject, the wire runtime the codec calls, and the
# SQL-filter `field_value()` — the same set as the sibling idlc-buildrs.
zerodds-wire = { path = "../../crates/wire" }
zerodds-dcps = { path = "../../crates/dcps" }
zerodds-types = { path = "../../crates/types" }
zerodds-sql-filter = { path = "../../crates/sql-filter" }
