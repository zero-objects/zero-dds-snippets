# The derive route of GitHub #33 (zerodds-codec): a topic type defined in
# Rust, its date-time group a checked newtype over the IDL `string`; the
# IDL route of the same type beside it, and a C peer.
# Own `[workspace]` table, so it is built where it stands and not through
# the repository's workspace.
[package]
name = "zerodds-example-rust-derive"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
zerodds-codec = { path = "../../crates/codec" }
zerodds-dcps = { path = "../../crates/dcps" }
zerodds-types = { path = "../../crates/types" }
zerodds-wire = { path = "../../crates/wire" }

[build-dependencies]
zerodds-build = { path = "../../crates/zerodds-build" }

[workspace]
