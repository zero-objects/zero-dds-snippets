[package]
name = "webdds-gateway"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

# Empty [workspace] isolates this from the parent zerodds workspace.
[workspace]

[[bin]]
name = "dds_side"
path = "src/main.rs"

[build-dependencies]
zerodds-build = { path = "../../crates/zerodds-build" }

[dependencies]
zerodds-wire = { path = "../../crates/wire" }
zerodds-dcps = { path = "../../crates/dcps" }
zerodds-types = { path = "../../crates/types" }
zerodds-sql-filter = { path = "../../crates/sql-filter" }
