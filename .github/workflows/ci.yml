name: examples
# Weekly and by hand, not on a push or a pull request: a full run provisions
# the vendor stacks and builds every example.
# Before a push, the examples run on the maintainers' Linux test host.
on:
  schedule:
    - cron: '0 6 * * 1'   # weekly: also catches crates.io drift
  workflow_dispatch:

# Two lanes, because they answer two different questions.
#
#   run          Does the example still work? It builds every example against
#                the ZeroDDS source and RUNS it, checking what it printed.
#                This is the lane that can fail for a real reason.
#   crates-io    Does the example still work for a reader who has no checkout,
#                only the published crates? Compile-only against crates.io.
#
# A compiled example proves the API names still exist. It does not prove a
# sample crossed the wire or that a round-trip is lossless. That is why the
# `run` lane exists and why it comes first.

# `shell: bash` runs a step with `-eo pipefail`; the default is `bash -e`,
# under which `cmd | tee log` reports tee's status and a failing cmd passes.
defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # The vendor toolchains the cross-vendor examples run against, each built
  # by its ci/provision script into a prefix that is cached. The first build
  # of OpenDDS takes the better part of an hour; the four run side by side
  # here so the `run` job finds them in the cache. A prefix carries a stamp of
  # its pins, and a script that finds its stamp does not build again.
  # ---------------------------------------------------------------------------
  vendors:
    name: vendor toolchain (${{ matrix.vendor }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # `recipe`: the file of the ZeroDDS tree a script builds from, part of
      # its cache key; the script itself where there is none.
      matrix:
        include:
          - { vendor: cyclone-iceoryx, recipe: zerodds-examples/ci/provision/cyclone-iceoryx.sh }
          - { vendor: fastdds, recipe: tests/interop/ci/install_fastdds.sh }
          - { vendor: opendds, recipe: zerodds-examples/ci/provision/opendds.sh }
          - { vendor: opensplice, recipe: tools/opensplice/build-opensplice.sh }
    steps:
      - uses: actions/checkout@v5
        with:
          repository: zero-objects/zero-dds
      - uses: actions/checkout@v5
        with: { path: zerodds-examples }
      - name: Cache key
        id: key
        run: |
          echo "key=vendor-${{ matrix.vendor }}-$ImageOS-${{ hashFiles('zerodds-examples/ci/provision/common.sh', format('zerodds-examples/ci/provision/{0}.sh', matrix.vendor), matrix.recipe) }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/vendors/${{ matrix.vendor }}
          key: ${{ steps.key.outputs.key }}
      - name: Provision ${{ matrix.vendor }}
        env:
          ZERODDS_SRC: ${{ github.workspace }}
        run: bash zerodds-examples/ci/provision/${{ matrix.vendor }}.sh "$HOME/vendors/${{ matrix.vendor }}"

  run:
    name: build and run (against the ZeroDDS source)
    # After the vendor jobs, whatever they concluded: a toolchain that did not
    # build leaves its examples unverified, which fails this job by name,
    # and every other example is still run.
    needs: vendors
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # One target directory for the ZeroDDS tree and every example, as on a
      # developer's checkout: each example otherwise compiles the DCPS runtime
      # into a target directory of its own, and a hundred of those fill the
      # runner's disk.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: always
    steps:
      # The examples' path deps (`../../crates`, deeper for nested examples)
      # reach into the ZeroDDS tree from inside it: this repository is used
      # as a directory of a ZeroDDS checkout, which is what ci/run-examples.sh
      # assumes when ZERODDS_SRC is unset. So ZeroDDS goes into the workspace
      # root, first (a checkout cleans its target directory), and this
      # repository into a directory of it.
      - uses: actions/checkout@v5
        with:
          repository: zero-objects/zero-dds
      - uses: actions/checkout@v5
        with: { path: zerodds-examples }
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      # The toolchain rust-toolchain.toml of the ZeroDDS tree names is the
      # one cargo runs below; the WebAssembly target goes onto that one.
      - name: WebAssembly target and wasm-pack
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      # ---- what the examples load, built from this ZeroDDS tree -------------
      - name: Build the C ABI shared library the C/C++/C#/Java examples link
        run: cargo build -p zerodds-c-api --release
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: OMG DDS Java binding jar (the probe looks for target/omgdds-*.jar)
        working-directory: crates/java-omgdds/java
        run: mvn -B -q install -DskipTests
      # Two interpreters. The zerodds extension (abi3) goes into a virtualenv
      # of the runner's python3, with the system packages visible: ROS 2
      # builds rclpy for that python3, and rmw-spatial-bridge runs it.
      # cyclonedds 11.0.1 has wheels for CPython 3.10 to 3.13 only; it gets a
      # 3.13 virtualenv of its own, which the cyclone legs take from PYTHON.
      - name: Python virtualenv with the zerodds extension
        run: |
          python3 --version
          python3 -m venv --system-site-packages "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install maturin
          # The extension depends on zerodds-wire of the same version, which
          # reaches PyPI with the release; this tree has it in runtime/python.
          "$RUNNER_TEMP/venv/bin/pip" install ./runtime/python
          ( cd crates/py && VIRTUAL_ENV="$RUNNER_TEMP/venv" PATH="$RUNNER_TEMP/venv/bin:$PATH" maturin develop --release )
          "$RUNNER_TEMP/venv/bin/python3" -c 'import zerodds; print("zerodds importable")'
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v6
        id: py313
        with:
          python-version: "3.13"
          update-environment: false
      - name: Python 3.13 virtualenv with cyclonedds
        run: |
          "${{ steps.py313.outputs.python-path }}" -m venv "$RUNNER_TEMP/venv-cyclone"
          "$RUNNER_TEMP/venv-cyclone/bin/pip" install "cyclonedds==11.0.1"
          "$RUNNER_TEMP/venv-cyclone/bin/python3" -c 'import cyclonedds; print("cyclonedds importable")'
          echo "PYTHON=$RUNNER_TEMP/venv-cyclone/bin/python3" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # The harness builds @zerodds/wire and @zerodds/node itself; it needs
      # their node_modules. @zerodds/ts-wasm it takes as built.
      - name: TypeScript packages (node_modules, ts-wasm build, tsc)
        run: |
          npm ci --no-audit --no-fund --prefix runtime/typescript
          ( cd crates/ts-node && npm install --no-audit --no-fund --install-links=false )
          ( cd crates/ts-wasm && npm install --no-audit --no-fund && npm run build:wasm && npm run build )
          npm install --global --no-audit --no-fund typescript
          tsc --version
      # The six DDS-Security files rust-security-plugin-chain loads, from the
      # test CA generator of the ZeroDDS tree. Test keys, made per run. The
      # generator's governance and permissions grant the bench's domain 200;
      # the example joins domain 0, so the copy grants that one before it is
      # signed.
      - name: DDS-Security test PKI
        run: |
          pki_src="$RUNNER_TEMP/pki-src"
          cp -r tests/perf/dds-roundtrip-bench/security "$pki_src"
          sed -i 's#<domains><id>200</id></domains>#<domains><id>0</id></domains>#' \
            "$pki_src/governance.xml" "$pki_src/permissions_ping.xml" "$pki_src/permissions_pong.xml"
          for f in governance.xml permissions_ping.xml; do
            grep -q '<domains><id>0</id></domains>' "$pki_src/$f" || { echo "$f does not grant domain 0"; exit 1; }
          done
          ( cd "$pki_src" && bash gen.sh )
          pki="$RUNNER_TEMP/pki"
          mkdir -p "$pki"
          cp "$pki_src/certs/identity_ca.pem" "$pki/ca-cert.pem"
          cp "$pki_src/certs/ping_cert.pem" "$pki/part-cert.pem"
          cp "$pki_src/certs/ping_key.pem" "$pki/part-key.pem"
          cp "$pki_src/certs/permissions_ca.pem" "$pki/permissions-ca-cert.pem"
          cp "$pki_src/governance.p7s" "$pki/governance.p7s"
          cp "$pki_src/permissions_ping.p7s" "$pki/permissions.p7s"
          echo "ZERODDS_PKI=$pki" >> "$GITHUB_ENV"

      # ---- the vendor toolchains -------------------------------------------
      # Restored from the caches the vendor jobs filled, then handed to the
      # same scripts: a prefix with its stamp is taken as it is, and the
      # script installs the system packages it was linked against. A cache
      # miss builds here. A script that fails leaves its examples unverified,
      # which fails the run below by name; the other examples still run.
      - name: Vendor cache keys
        id: vk
        run: |
          {
            echo "cyclone=vendor-cyclone-iceoryx-$ImageOS-${{ hashFiles('zerodds-examples/ci/provision/common.sh', 'zerodds-examples/ci/provision/cyclone-iceoryx.sh', 'zerodds-examples/ci/provision/cyclone-iceoryx.sh') }}"
            echo "fastdds=vendor-fastdds-$ImageOS-${{ hashFiles('zerodds-examples/ci/provision/common.sh', 'zerodds-examples/ci/provision/fastdds.sh', 'tests/interop/ci/install_fastdds.sh') }}"
            echo "opendds=vendor-opendds-$ImageOS-${{ hashFiles('zerodds-examples/ci/provision/common.sh', 'zerodds-examples/ci/provision/opendds.sh', 'zerodds-examples/ci/provision/opendds.sh') }}"
            echo "opensplice=vendor-opensplice-$ImageOS-${{ hashFiles('zerodds-examples/ci/provision/common.sh', 'zerodds-examples/ci/provision/opensplice.sh', 'tools/opensplice/build-opensplice.sh') }}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        with: { path: ~/vendors/cyclone-iceoryx, key: "${{ steps.vk.outputs.cyclone }}" }
      - uses: actions/cache/restore@v5
        with: { path: ~/vendors/fastdds, key: "${{ steps.vk.outputs.fastdds }}" }
      - uses: actions/cache/restore@v5
        with: { path: ~/vendors/opendds, key: "${{ steps.vk.outputs.opendds }}" }
      - uses: actions/cache/restore@v5
        with: { path: ~/vendors/opensplice, key: "${{ steps.vk.outputs.opensplice }}" }
      - name: Cyclone DDS C with the iceoryx plugin
        continue-on-error: true
        env: { ZERODDS_SRC: "${{ github.workspace }}" }
        run: bash zerodds-examples/ci/provision/cyclone-iceoryx.sh "$HOME/vendors/cyclone-iceoryx"
      - name: Fast DDS
        continue-on-error: true
        env: { ZERODDS_SRC: "${{ github.workspace }}" }
        run: bash zerodds-examples/ci/provision/fastdds.sh "$HOME/vendors/fastdds"
      - name: OpenDDS
        continue-on-error: true
        env: { ZERODDS_SRC: "${{ github.workspace }}" }
        run: bash zerodds-examples/ci/provision/opendds.sh "$HOME/vendors/opendds"
      - name: OpenSplice
        continue-on-error: true
        env: { ZERODDS_SRC: "${{ github.workspace }}" }
        run: bash zerodds-examples/ci/provision/opensplice.sh "$HOME/vendors/opensplice"
      # Not cached: rmw_zerodds_cpp is built from this ZeroDDS tree.
      - name: ROS 2 and rmw_zerodds_cpp
        continue-on-error: true
        env: { ZERODDS_SRC: "${{ github.workspace }}" }
        run: bash zerodds-examples/ci/provision/ros2-rmw.sh "$HOME/vendors/rmw-zerodds"

      # ---- the run ----------------------------------------------------------
      # crate-rt-linux asks for SCHED_FIFO at priority 80. RLIMIT_RTPRIO of
      # this step's shell is raised so it and its children may (sched(7));
      # nothing runs as root. The RTI legs are named in
      # ci/elsewhere-github.txt with the reason.
      - name: Build and run every example
        working-directory: zerodds-examples
        env:
          ZERODDS_SRC: ${{ github.workspace }}
          EX_ELSEWHERE: ci/elsewhere-github.txt
        run: |
          sudo prlimit --pid $$ --rtprio=99:99
          ci/run-examples.sh

  crates-io:
    name: build against the published crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build every cargo example against the published crates
        run: |
          set -euo pipefail

          # The release the examples are pinned to here. Bump it when a new
          # rc is published. An example whose dependency does not exist on
          # crates.io at this release fails here, by design: it is named in
          # the log, and the `run` lane above still builds and runs it
          # against the source.
          PUBLISHED=1.0.0-rc.7

          # The examples carry monorepo path deps (../../crates, ../../tools)
          # for local development inside the zerodds checkout. Outside the
          # monorepo those paths do not exist, so this lane rewrites
          # `path = "../../{crates,tools}/X"` to `version = "$PUBLISHED"`
          # before building.
          find . -name Cargo.toml -not -path '*/target/*' -exec \
            sed -i -E "s#path = \"\.\./\.\./(crates|tools)/[^\"]*\"#version = \"$PUBLISHED\"#g" {} +

          # Every example is built, and the ones that fail are named
          # together at the end: a lane that stops at the first failure
          # says nothing about the examples after it.
          built=0
          failed=""
          for dir in */; do
            [ -f "$dir/Cargo.toml" ] || continue
            echo "::group::$dir"
            if ( cd "$dir" && cargo build ); then
              built=$((built + 1))
            else
              failed="$failed ${dir%/}"
            fi
            echo "::endgroup::"
          done
          echo "crates.io lane: $built example(s) built against $PUBLISHED."
          if [ -n "$failed" ]; then
            echo "::error::did not build against $PUBLISHED:$failed"
            exit 1
          fi
