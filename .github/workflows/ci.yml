name: examples
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly: catch crates.io drift even without a push

jobs:
  build:
    name: build examples (crates.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install zerodds-idlc CLI (idlc-buildrs shells out to it)
        # `^` matters here: `cargo install --version X` without an operator
        # pins the exact version X, while `cargo install --version ^X`
        # resolves like a Cargo.toml dependency requirement (highest
        # matching pre-release). The rewrite below uses the latter form
        # implicitly (Cargo.toml deps default to caret), so this uses the
        # same explicit `^1.0.0-rc.4` to stay resolved to the same rc.
        run: cargo install zerodds-idlc --version "^1.0.0-rc.4"
      - name: Build every cargo example against the published crates
        run: |
          set -e
          # The examples carry monorepo path-deps (../../crates, ../../tools) for
          # local development inside the zerodds checkout. Outside the monorepo
          # those paths don't exist, so for the public repo we build them against
          # the published crates.io versions: rewrite `path = "../../{crates,tools}/X"`
          # to `version = "1.0.0-rc.4"` before building. Compile-only (cargo build):
          # running the pub/sub examples needs live DDS infra not present in CI.
          find . -name Cargo.toml -not -path '*/target/*' -exec \
            sed -i -E 's#path = "\.\./\.\./(crates|tools)/[^"]*"#version = "1.0.0-rc.4"#g' {} +
          # zerodds-build-sample depends on crates/zerodds-build, a monorepo
          # crate that exists on main but has never been published to
          # crates.io (crates.io API for it: "crate `zerodds-build` does not
          # exist"). The path-dep rewrite above can't turn that into a
          # resolvable `version = ...` requirement, so this example can't
          # build against crates.io yet — skip it loudly here, pending
          # zerodds-build's first publish (tracked for the rc7 crates.io
          # cut). Not a masked failure: every skip is logged as a warning.
          UNPUBLISHED_DEP_EXAMPLES="zerodds-build-sample"
          for dir in */; do
            [ -f "$dir/Cargo.toml" ] || continue
            name="${dir%/}"
            case " $UNPUBLISHED_DEP_EXAMPLES " in
              *" $name "*)
                echo "::warning::skipping $name — depends on a crate not yet published to crates.io (see workflow comment)"
                continue
                ;;
            esac
            echo "::group::$dir"
            ( cd "$dir" && cargo build )
            echo "::endgroup::"
          done
