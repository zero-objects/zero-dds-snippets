# Cases in the IDL-to-Rust route found beside GitHub #62 to #64, and the
# enum-prefix switch of GitHub #61: generated by `build.rs`, checked by
# `cargo run`. Own `[workspace]` table, so it is built where it stands and
# not through the repository's workspace.
[package]
name = "zerodds-example-zerodds-build-cases"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
zerodds-dcps = { path = "../../crates/dcps" }
# The generated field of a `long double` is a `zerodds_float128::Float128`.
zerodds-float128 = { path = "../../crates/float128" }
zerodds-types = { path = "../../crates/types" }
zerodds-wire = { path = "../../crates/wire" }

[build-dependencies]
zerodds-build = { path = "../../crates/zerodds-build" }

[workspace]
