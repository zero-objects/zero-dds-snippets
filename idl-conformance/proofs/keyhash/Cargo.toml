[package]
name = "keyhash-proof"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

# Standalone example: empty [workspace] so it does NOT join the parent
# zerodds workspace; path-deps reach into ../../../../crates.
[workspace]

[[bin]]
name = "keyhash_proof"
path = "src/main.rs"

[build-dependencies]
# Replaces the former `zerodds-idl` + `zerodds-idl-rust` pair.
zerodds-build = { path = "../../../../crates/zerodds-build" }

[dependencies]
# DdsType (compute_key_hash, encode_key_holder_be) + Extensibility, and the
# PlainCdr2BeKeyHolder that used to live in `zerodds-cdr`.
zerodds-dcps = { path = "../../../../crates/dcps" }
# The wire runtime the generated encode/decode bodies call — replaces
# `zerodds-cdr`.
zerodds-wire = { path = "../../../../crates/wire" }
# Generated DdsType impls reference zerodds_types::TypeIdentifier.
zerodds-types = { path = "../../../../crates/types" }
# Generated field_value() references zerodds_sql_filter::Value.
zerodds-sql-filter = { path = "../../../../crates/sql-filter" }
